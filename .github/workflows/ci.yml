name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Browser smoke test (fixture game replay)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Start server (offline, fixtures only)
        run: |
          GRIDCAST_OFFLINE=1 PORT=8787 pnpm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8787/api/health && break; sleep 1; done
      - run: pnpm smoke http://localhost:8787 smoke-out 30
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            smoke-out/
            server.log

  docker:
    name: Container builds and serves the demo replay
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gridcast .
      - name: Run offline and hit the API
        run: |
          docker run -d --name gc -p 8080:8080 -e GRIDCAST_OFFLINE=1 -e ADMIN_TOKEN=ci gridcast
          for i in $(seq 1 40); do curl -sf localhost:8080/api/health && break; sleep 2; done
          curl -sf localhost:8080/api/games/401873002 | head -c 300
          curl -sf localhost:8080/ | grep -q '<div id="root">'
      - if: failure()
        run: docker logs gc
