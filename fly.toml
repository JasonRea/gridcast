# fly launch --no-deploy --copy-config  (first time), then: fly deploy
app = "gridcast-028f"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  FEATURED_GAME_ID = "401873011"
  DEMO_GAME_ID = "401873002"

# Event logs, commentary cache and raw recordings survive deploys and restarts.
[mounts]
  source = "gridcast_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # SSE and live polling need the machine up during the game: never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpus = 1
